AWSTemplateFormatVersion: "2010-09-09"
Description: >-
  AWS Bedrock Architecture Academy - learning example, never deployed by the authors.
  Child template for 03-nested-parent.yaml: one IAM role that may invoke a fixed list of
  Amazon Bedrock models or inference profiles and apply one guardrail. Every value comes
  from the parent through Parameters; results go back through Outputs.
  Status: validated with cfn-lint only.

Parameters:
  NamePrefix:
    Type: String
    Description: Prefix used in tags and descriptions (the role name itself is generated).
    AllowedPattern: "^[a-z][a-z0-9-]{2,30}$"

  GuardrailArn:
    Type: String
    Description: ARN of the guardrail the role may apply.
    AllowedPattern: "^arn:aws(-[^:]+)?:bedrock:[a-z0-9-]+:[0-9]{12}:guardrail/[a-z0-9]+$"

  AllowedModelArns:
    Type: CommaDelimitedList
    Description: Comma-separated ARNs of foundation models or inference profiles the role may invoke.

  TrustedService:
    Type: String
    Description: The AWS service that assumes this role.
    AllowedValues:
      - lambda.amazonaws.com
      - ecs-tasks.amazonaws.com

Resources:
  InvocationRole:
    Type: AWS::IAM::Role
    Properties:
      Description: !Sub "Bedrock invocation role for ${NamePrefix}, created by nested stack ${AWS::StackName}"
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: !Ref TrustedService
            Action: sts:AssumeRole
      Policies:
        - PolicyName: bedrock-invoke
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Sid: InvokeListedModels
                Effect: Allow
                Action:
                  - bedrock:InvokeModel
                  - bedrock:InvokeModelWithResponseStream
                Resource: !Ref AllowedModelArns
              - Sid: ApplyOneGuardrail
                Effect: Allow
                Action:
                  - bedrock:ApplyGuardrail
                  - bedrock:GetGuardrail
                Resource: !Ref GuardrailArn
      Tags:
        - Key: NamePrefix
          Value: !Ref NamePrefix

Outputs:
  InvocationRoleArn:
    Description: Read in the parent with !GetAtt <NestedStackLogicalId>.Outputs.InvocationRoleArn
    Value: !GetAtt InvocationRole.Arn

  InvocationRoleName:
    Description: Generated role name.
    Value: !Ref InvocationRole
